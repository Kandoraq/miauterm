name: Build Miauterm APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Founder-approved release tag (for example v0.1.1). Leave empty to build without publishing.'
        required: false
        default: ''
        type: string
permissions: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install rootfs test tools
        run: sudo apt-get update && sudo apt-get install -y zstd libcap2-bin gcc-aarch64-linux-gnu
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager failed at attempt $attempt" >&2
            sleep 20
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Build ARM64 Debian port mapping library
        run: bash scripts/build-port-remap.sh
      - name: Verify Debian commands and default home creation
        run: bash scripts/verify-rootfs.sh
      - name: Validate approved release tag against app version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version" || { echo "versionName not found in app/build.gradle.kts" >&2; exit 1; }
          test "$RELEASE_TAG" = "v$version" || { echo "Release tag $RELEASE_TAG does not match versionName $version" >&2; exit 1; }
          code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$code" || { echo "versionCode not found in app/build.gradle.kts" >&2; exit 1; }
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA" || {
              echo "Release tag $RELEASE_TAG does not point at the checked-out commit" >&2
              exit 1
            }
          fi
      - name: Run all unit tests
        run: ./gradlew --no-daemon test
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build installable arm64 APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Name the APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/Miauterm-arm64-debug.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1 | xargs dirname)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/libmiauterm-portmap.so > "$RUNNER_TEMP/miauterm-portmap.so"
          readelf -h "$RUNNER_TEMP/miauterm-portmap.so" | grep -F 'AArch64'
          EXPECTED_ROOTFS_SHA="$(sha256sum app/src/main/assets/debian-arm64.tar.zst | cut -d ' ' -f 1)"
          PACKAGED_ROOTFS_SHA="$(unzip -p "$APK" assets/debian-arm64.tar.zst | sha256sum | cut -d ' ' -f 1)"
          test "$PACKAGED_ROOTFS_SHA" = "$EXPECTED_ROOTFS_SHA"
          (cd dist && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          printf 'Extract this GitHub Actions artifact ZIP first, then install Miauterm-arm64-debug.apk.\n' > dist/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: miauterm-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: inputs.release_tag != ''
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install rootfs test tools
        run: sudo apt-get update && sudo apt-get install -y zstd libcap2-bin gcc-aarch64-linux-gnu
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager failed at attempt $attempt" >&2
            sleep 20
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Build ARM64 Debian port mapping library
        run: bash scripts/build-port-remap.sh
      - name: Verify Debian commands and default home creation
        run: bash scripts/verify-rootfs.sh
      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/miauterm-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/miauterm-release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and package direct APK download
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          OUT="dist/Miauterm-${RELEASE_TAG}-arm64.apk"
          cp "$APK" "$OUT"
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          test -f "$MAPPING"
          MAPPING_OUT="dist/Miauterm-${RELEASE_TAG}-mapping.txt"
          cp "$MAPPING" "$MAPPING_OUT"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1 | xargs dirname)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT"
          EXPECTED_SIGNER_SHA256="677DAD7CFB5AF27A62815D6BC109CE7BC085D94657629944B544FD7D847ED95A"
          ACTUAL_SIGNER_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_SIGNER_SHA256" = "$EXPECTED_SIGNER_SHA256"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$OUT"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | grep -F "package: name='com.miauterm.terminal'"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | grep -F "application-label:'Miauterm'"
          unzip -t "$OUT"
          unzip -p "$OUT" assets/libmiauterm-portmap.so > "$RUNNER_TEMP/miauterm-portmap.so"
          readelf -h "$RUNNER_TEMP/miauterm-portmap.so" | grep -F 'AArch64'
          EXPECTED_ROOTFS_SHA="$(sha256sum app/src/main/assets/debian-arm64.tar.zst | cut -d ' ' -f 1)"
          PACKAGED_ROOTFS_SHA="$(unzip -p "$OUT" assets/debian-arm64.tar.zst | sha256sum | cut -d ' ' -f 1)"
          test "$PACKAGED_ROOTFS_SHA" = "$EXPECTED_ROOTFS_SHA"
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          (cd dist && sha256sum "$(basename "$MAPPING_OUT")" > "$(basename "$MAPPING_OUT").sha256")
      - name: Download the debug APK built above
        uses: actions/download-artifact@v8
        with:
          name: miauterm-debug-apk
          path: debug-dist
      - name: Publish APKs and checksums to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_FILES=(dist/*.apk dist/*.sha256 dist/*.txt)
          if [ -d debug-dist ]; then
            RELEASE_FILES+=(debug-dist/Miauterm-arm64-debug.apk debug-dist/Miauterm-arm64-debug.apk.sha256)
          fi
          NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE" --latest --title "Miauterm $RELEASE_TAG"
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest --title "Miauterm $RELEASE_TAG"
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$RELEASE_TAG" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file "$NOTES_FILE" --latest --title "Miauterm $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --latest --title "Miauterm $RELEASE_TAG"
          fi
